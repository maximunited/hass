esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.5.0
  on_boot:
    - priority: -100
      then:
        - component.resume: stick_display
        - light.turn_on:
            id: backlight
            brightness: 40%
        - lambda: |-
            M5.Speaker.end();
    - priority: 600
      then:
        - script.execute: apply_clock_rotation
  libraries:
    - Wire
    - SPI
    - M5PM1=git+https://github.com/m5stack/M5PM1.git#1.0.6
    - m5stack/M5Unified@^0.2.12
    - m5stack/M5GFX@^0.2.18
  platformio_options:
    board_build.arduino.memory_type: qio_opi
    build_flags:
      - -DESP32S3
      - -DBOARD_HAS_PSRAM
      - -mfix-esp32-psram-cache-issue
      - -DCORE_DEBUG_LEVEL=1
      - -DARDUINO_USB_CDC_ON_BOOT=1
      - -DARDUINO_USB_MODE=1

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: arduino

psram:
  mode: octal
  speed: 80MHz

globals:
  - id: display_mode
    type: int
    restore_value: no
    initial_value: "0"
  - id: safe_start_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: oref_prev_state
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: oref_prev_raw
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: oref_state_changed
    type: bool
    restore_value: no
    initial_value: "false"
  - id: ha_connected
    type: bool
    restore_value: no
    initial_value: "false"
  - id: btn_a_last_release_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: btn_a_pending_single
    type: bool
    restore_value: no
    initial_value: "false"
  - id: clock_rotation_deg
    type: int
    restore_value: yes
    initial_value: "270"
  - id: clock_screen_asleep
    type: bool
    restore_value: no
    initial_value: "false"
  - id: test_shelter_secs
    type: int
    restore_value: no
    initial_value: "90"

external_components:
  - source:
      type: git
      url: https://github.com/TitoTB/M5StickS3-ESPHome.git
      ref: main
      path: components
    components:
      - m5sticks3_display
      - m5sticks3_power
    refresh: 1days

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "M5Stick-S3 Fallback"
    password: !secret ap_password

logger:
  level: DEBUG
  baud_rate: 0
  hardware_uart: USB_SERIAL_JTAG

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key
  on_client_connected:
    - lambda: 'id(ha_connected) = true;'
    - script.execute: clock_status_text
  on_client_disconnected:
    - lambda: 'id(ha_connected) = false;'
    - script.execute: clock_status_text

ota:
  - platform: esphome
    password: !secret ota_password

display:
  - platform: m5sticks3_display
    id: stick_display

time:
  - platform: homeassistant
    id: esptime
    on_time_sync:
      then:
        - script.execute: refresh_clock_labels
    on_time:
      - seconds: 0
        then:
          - if:
              condition:
                and:
                  - lambda: 'return id(display_mode) == 0;'
                  - lambda: 'return !id(clock_screen_asleep);'
              then:
                - script.execute: refresh_clock_labels

interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: 'return id(display_mode) == 2;'
          then:
            - lambda: |-
                if (id(oref_prev_state) == "test_alert" && id(test_shelter_secs) > 0) {
                  id(test_shelter_secs)--;
                }
            - script.execute: update_shelter_label
  - interval: 10s
    then:
      - lambda: |-
          id(api_connected_ha).publish_state(id(ha_connected));
          id(external_power).publish_state(
              M5.Power.isCharging() == m5::Power_Class::is_charging_t::is_charging);
      - if:
          condition:
            and:
              - lambda: 'return id(display_mode) == 0;'
              - lambda: 'return !id(clock_screen_asleep);'
          then:
            - script.execute: clock_status_text
