# Shared Sinilink XY-WFUSB firmware. Device files set name / friendly_name.
# https://devices.esphome.io/devices/sinilink-xy-wfusb-usb-switch-relay

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp8266:
  board: esp8285
  restore_from_flash: true

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: HIGH
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password
    ap_timeout: 3min

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

time:
  - platform: homeassistant

status_led:
  pin: GPIO16

switch:
  - platform: gpio
    id: switch_relay
    pin: GPIO5

  - platform: gpio
    pin: GPIO14
    id: green_led
    inverted: true

  - platform: template
    id: relay
    name: "${friendly_name}"
    icon: mdi:usb
    restore_mode: RESTORE_DEFAULT_OFF
    lambda: |-
      if (id(switch_relay).state) {
        return true;
      } else {
        return false;
      }
    turn_on_action:
      - switch.turn_on: green_led
      - switch.turn_on: switch_relay
    turn_off_action:
      - switch.turn_off: green_led
      - switch.turn_off: switch_relay

binary_sensor:
  - platform: gpio
    id: hardware_button
    name: "${friendly_name} Button"
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - switch.toggle: relay

sensor:
  - platform: wifi_signal
    name: "${friendly_name} WiFi"
    update_interval: 60s

button:
  - platform: restart
    name: "${friendly_name} Restart"
