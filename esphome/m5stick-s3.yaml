substitutions:
  name: m5stick-s3
  friendly_name: M5Stick S3
  idle_time: 30s
  pikud_flash_seconds: 3s
  pikud_safe_max_minutes: "5"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.5.0
  on_boot:
    - priority: -100
      then:
        - component.resume: stick_display
        - light.turn_on:
            id: backlight
            brightness: 40%
        - lambda: |-
            M5.Speaker.end();
  libraries:
    - Wire
    - SPI
    - M5PM1=git+https://github.com/m5stack/M5PM1.git#1.0.6
    - m5stack/M5Unified@^0.2.7
    - m5stack/M5GFX@^0.2.18
  platformio_options:
    board_build.arduino.memory_type: qio_opi
    build_flags:
      - -DESP32S3
      - -DBOARD_HAS_PSRAM
      - -mfix-esp32-psram-cache-issue
      - -DCORE_DEBUG_LEVEL=1
      - -DARDUINO_USB_CDC_ON_BOOT=1
      - -DARDUINO_USB_MODE=1

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: arduino

psram:
  mode: octal
  speed: 80MHz

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "M5Stick-S3 Fallback"
    password: !secret ap_password

logger:
  level: DEBUG
  baud_rate: 0
  hardware_uart: USB_SERIAL_JTAG

captive_portal:

globals:
  - id: display_mode
    type: int
    restore_value: no
    initial_value: "0"
  - id: safe_start_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: btn_a_long_fired
    type: bool
    restore_value: no
    initial_value: "false"
  - id: clock_brightness_high
    type: bool
    restore_value: no
    initial_value: "false"
  - id: oref_prev_state
    type: std::string
    restore_value: no
    initial_value: '""'

external_components:
  - source:
      type: git
      url: https://github.com/TitoTB/M5StickS3-ESPHome.git
      ref: main
      path: components
    components:
      - m5sticks3_display
      - m5sticks3_power
    refresh: 1days

text_sensor:
  - platform: homeassistant
    id: oref_alert_state
    entity_id: sensor.m5stick_pikud_display_state
    internal: true
    on_value:
      then:
        - script.execute: handle_oref_state

sensor:
  - platform: homeassistant
    id: shelter_seconds
    entity_id: sensor.oref_alert_time_to_shelter
    internal: true

binary_sensor:
  - platform: gpio
    id: key1
    name: "Button A"
    pin:
      number: GPIO11
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
    on_press:
      then:
        - lambda: 'id(btn_a_long_fired) = false;'
        - delay: 800ms
        - if:
            condition:
              and:
                - binary_sensor.is_on: key1
                - lambda: 'return !id(btn_a_long_fired);'
            then:
              - lambda: 'id(btn_a_long_fired) = true;'
              - script.execute: pikud_dismiss
    on_release:
      then:
        - if:
            condition:
              lambda: 'return !id(btn_a_long_fired);'
            then:
              - script.execute: button_a_short

  - platform: gpio
    id: key2
    name: "Button B"
    pin:
      number: GPIO12
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
    on_press:
      then:
        - script.execute: button_b_short

font:
  - file: "gfonts://Figtree"
    id: font_date
    size: 18
  - file: "gfonts://Figtree"
    id: font_battery
    size: 14
  - file: "gfonts://Figtree"
    id: font_clock
    size: 48
  - file: "gfonts://Figtree"
    id: font_ampm
    size: 16
  - file: "gfonts://Kanit"
    id: font_alert
    size: 38
  - file: "gfonts://Kanit"
    id: font_shelter
    size: 18

light:
  - platform: monochromatic
    id: backlight
    name: "Display backlight"
    icon: mdi:cellphone
    output: lcd_backlight_raw
    restore_mode: ALWAYS_ON
    default_transition_length: 0s

m5sticks3_power:
  id: stick_power
  update_interval: 10s
  battery_level:
    id: battery_level
    name: "Battery level"
    internal: true
  charging:
    id: external_power
    name: "External power"
    internal: true
    on_state:
      then:
        - if:
            condition:
              and:
                - binary_sensor.is_on: external_power
                - lambda: 'return id(display_mode) == 0;'
            then:
              - script.execute: render_clock_screen
  beep:
    name: "Confirmation beep"
    internal: true

output:
  - platform: ledc
    pin: GPIO38
    id: lcd_backlight_raw
    frequency: 1000Hz

script:
  - id: clock_status_text
    then:
      - lvgl.label.update:
          id: lbl_battery
          text: !lambda |-
            if (id(external_power).state) {
              return std::string("USB");
            }
            if (isnan(id(battery_level).state)) {
              return std::string("--%");
            }
            char buf[8];
            snprintf(buf, sizeof(buf), "%.0f%%", id(battery_level).state);
            return std::string(buf);

  - id: clock_time_text
    then:
      - script.execute: clock_status_text
      - lvgl.label.update:
          id: lbl_clock
          text: !lambda |-
            auto t = id(esptime).now();
            int h = t.hour % 12;
            if (h == 0) h = 12;
            char buf[8];
            snprintf(buf, sizeof(buf), "%d:%02d", h, t.minute);
            return std::string(buf);
      - lvgl.label.update:
          id: lbl_ampm
          text: !lambda |-
            return id(esptime).now().hour < 12 ? std::string("AM") : std::string("PM");

  - id: pikud_wake_display
    then:
      - lvgl.resume:
      - light.turn_on:
          id: backlight
          brightness: 90%

  - id: render_clock_screen
    then:
      - lvgl.resume:
      - script.execute: clock_time_text
      - lvgl.label.update:
          id: lbl_date
          text: !lambda 'return id(esptime).now().strftime("%d/%m/%y");'
      - lvgl.widget.hide: lbl_shelter
      - lvgl.page.show: page_clock
      - if:
          condition:
            binary_sensor.is_on: external_power
          then:
            - light.turn_on:
                id: backlight
                brightness: 70%
          else:
            - if:
                condition:
                  lambda: 'return id(clock_brightness_high);'
                then:
                  - light.turn_on:
                      id: backlight
                      brightness: 90%
                else:
                  - light.turn_on:
                      id: backlight
                      brightness: 40%

  - id: pikud_show_clock
    mode: restart
    then:
      - lambda: 'id(display_mode) = 0;'
      - script.execute: render_clock_screen

  - id: pikud_dismiss
    mode: restart
    then:
      - script.execute: pikud_show_clock

  - id: button_a_short
    then:
      - if:
          condition:
            lambda: 'return id(display_mode) == 0;'
          then:
            - script.execute: render_clock_screen
            - if:
                condition:
                  lambda: 'return id(clock_brightness_high);'
                then:
                  - lambda: 'id(clock_brightness_high) = false;'
                  - light.turn_on:
                      id: backlight
                      brightness: 40%
                else:
                  - lambda: 'id(clock_brightness_high) = true;'
                  - light.turn_on:
                      id: backlight
                      brightness: 90%
          else:
            - script.execute: pikud_wake_display

  - id: button_b_short
    then:
      - script.execute: pikud_wake_display
      - if:
          condition:
            lambda: 'return id(display_mode) == 2;'
          then:
            - lvgl.label.update:
                id: lbl_shelter
                text: !lambda |-
                  if (isnan(id(shelter_seconds).state)) {
                    return std::string("Shelter: ?");
                  }
                  int secs = (int) id(shelter_seconds).state;
                  int mins = secs / 60;
                  int rem = secs % 60;
                  char buf[24];
                  if (mins > 0) {
                    snprintf(buf, sizeof(buf), "Shelter: %dm %ds", mins, rem);
                  } else {
                    snprintf(buf, sizeof(buf), "Shelter: %ds", rem);
                  }
                  return std::string(buf);
            - lvgl.widget.show: lbl_shelter
            - delay: 5s
            - lvgl.widget.hide: lbl_shelter

  - id: handle_oref_state
    mode: restart
    then:
      - lambda: |-
          const std::string &raw = id(oref_alert_state).state;
          std::string s = raw;
          const size_t pipe = raw.find('|');
          if (pipe != std::string::npos) {
            s = raw.substr(0, pipe);
          }
          const std::string &prev = id(oref_prev_state);
          if (s == "pre_alert" || s == "test_pre_alert") {
            id(display_mode) = 1;
          } else if (s == "alert" || s == "test_alert") {
            id(display_mode) = 2;
          } else if (s == "test_ok") {
            id(display_mode) = 3;
            id(safe_start_ms) = millis();
          } else if (s == "ok") {
            if (prev == "alert" || prev == "pre_alert") {
              id(display_mode) = 3;
              id(safe_start_ms) = millis();
            } else {
              id(display_mode) = 0;
            }
          } else {
            id(display_mode) = 0;
          }
          id(oref_prev_state) = s;
      - script.stop: pikud_pre_alert_loop
      - script.stop: pikud_alert_loop
      - script.stop: pikud_safe_loop
      - script.stop: pikud_show_clock
      - if:
          condition:
            lambda: 'return id(display_mode) == 1;'
          then:
            - script.execute: pikud_pre_alert_loop
      - if:
          condition:
            lambda: 'return id(display_mode) == 2;'
          then:
            - script.execute: pikud_alert_loop
      - if:
          condition:
            lambda: 'return id(display_mode) == 3;'
          then:
            - script.execute: pikud_safe_loop
      - if:
          condition:
            lambda: 'return id(display_mode) == 0;'
          then:
            - script.execute: pikud_show_clock

  - id: pikud_pre_alert_loop
    mode: restart
    then:
      - while:
          condition:
            lambda: 'return id(display_mode) == 1;'
          then:
            - script.execute: pikud_wake_display
            - lvgl.widget.hide: lbl_shelter
            - lvgl.page.show: page_pre_alert_text
            - delay: ${pikud_flash_seconds}
            - if:
                condition:
                  lambda: 'return id(display_mode) != 1;'
                then:
                  - script.stop: pikud_pre_alert_loop
            - lvgl.page.show: page_pre_alert_full
            - delay: ${pikud_flash_seconds}
      - if:
          condition:
            lambda: 'return id(display_mode) == 0;'
          then:
            - script.execute: render_clock_screen

  - id: pikud_alert_loop
    mode: restart
    then:
      - while:
          condition:
            lambda: 'return id(display_mode) == 2;'
          then:
            - script.execute: pikud_wake_display
            - lvgl.page.show: page_alert_text
            - delay: ${pikud_flash_seconds}
            - if:
                condition:
                  lambda: 'return id(display_mode) != 2;'
                then:
                  - script.stop: pikud_alert_loop
            - lvgl.page.show: page_alert_full
            - delay: ${pikud_flash_seconds}
      - if:
          condition:
            lambda: 'return id(display_mode) == 0;'
          then:
            - script.execute: render_clock_screen

  - id: pikud_safe_loop
    mode: restart
    then:
      - while:
          condition:
            lambda: |-
              if (id(display_mode) != 3) return false;
              return (millis() - id(safe_start_ms)) < (${pikud_safe_max_minutes} * 60UL * 1000UL);
          then:
            - script.execute: pikud_wake_display
            - lvgl.widget.hide: lbl_shelter
            - lvgl.page.show: page_safe_text
            - delay: ${pikud_flash_seconds}
            - if:
                condition:
                  lambda: 'return id(display_mode) != 3;'
                then:
                  - script.stop: pikud_safe_loop
            - lvgl.page.show: page_safe_full
            - delay: ${pikud_flash_seconds}
      - lambda: |-
          if (id(display_mode) == 3) {
            id(display_mode) = 0;
          }
      - if:
          condition:
            lambda: 'return id(display_mode) == 0;'
          then:
            - script.execute: render_clock_screen

time:
  - platform: homeassistant
    id: esptime
    on_time_sync:
      then:
        - script.execute: clock_time_text
        - lvgl.label.update:
            id: lbl_date
            text: !lambda 'return id(esptime).now().strftime("%d/%m/%y");'

interval:
  - interval: 30s
    then:
      - if:
          condition:
            lambda: 'return id(display_mode) == 0;'
          then:
            - script.execute: clock_time_text
            - lvgl.label.update:
                id: lbl_date
                text: !lambda 'return id(esptime).now().strftime("%d/%m/%y");'

display:
  - platform: m5sticks3_display
    id: stick_display

lvgl:
  rotation: 270
  displays:
    - stick_display
  on_idle:
    - timeout: ${idle_time}
      then:
        - if:
            condition:
              and:
                - lambda: 'return id(display_mode) == 0;'
                - binary_sensor.is_off: external_power
            then:
              - lvgl.page.show: page_clock
              - lvgl.widget.redraw:
              - delay: 50ms
              - light.turn_off:
                  id: backlight
              - lvgl.pause:
  pages:
    - id: page_clock
      bg_color: 0x000000
      widgets:
        - label:
            id: lbl_date
            y: 4
            align: TOP_MID
            text: "--/--/--"
            text_color: 0x8A8A8A
            text_font: font_date
        - label:
            id: lbl_battery
            x: -4
            y: 4
            align: TOP_RIGHT
            text: "--%"
            text_color: 0x8A8A8A
            text_font: font_battery
        - label:
            id: lbl_clock
            align: CENTER
            y: -8
            text: "--:--"
            text_color: 0xFFFFFF
            text_font: font_clock
        - label:
            id: lbl_ampm
            align: CENTER
            y: 30
            text: "--"
            text_color: 0x8A8A8A
            text_font: font_ampm
        - label:
            id: lbl_shelter
            y: -8
            align: BOTTOM_MID
            text: ""
            text_color: 0xFFFFFF
            text_font: font_shelter
            hidden: true

    - id: page_pre_alert_text
      bg_color: 0x000000
      widgets:
        - label:
            align: CENTER
            text: "Pre-Alert"
            text_color: 0xFF8800
            text_font: font_alert

    - id: page_pre_alert_full
      bg_color: 0xFF8800

    - id: page_alert_text
      bg_color: 0x000000
      widgets:
        - label:
            align: CENTER
            text: "ALERT !"
            text_color: 0xFF0000
            text_font: font_alert

    - id: page_alert_full
      bg_color: 0xFF0000

    - id: page_safe_text
      bg_color: 0x000000
      widgets:
        - label:
            align: CENTER
            text: "SAFE"
            text_color: 0x00CC00
            text_font: font_alert

    - id: page_safe_full
      bg_color: 0x00CC00
