# https://www.home-assistant.io/components/input_boolean/

---

# Unused
maxim_home:
  name: Set Maxim Home/Away state
dana_home:
  name: Set Dana Home/Away state
maxim_dana_home:
  name: Set Maxim and Dana Home/Away state

# For living room AC state automation
living_ac:
  name: Living room AC

# For appliances cycle finish notifications (Clean/Dry)
disable_washing_machine_notification:
  name: Disable Washing Machine Notification
  initial: false
  icon: mdi:washing-machine

disable_dryer_notification:
  name: Disable Dryer Notification
  initial: false
  icon: mdi:tumble-dryer

disable_dishwasher_notification:
  name: Disable Dishwasher Notification
  initial: false
  icon: mdi:dishwasher

# Toggle on to run Notify Missing Sensors automation
notify_missing_sensors:
  name: Check Missing Sensors (run notification)
  initial: false
  icon: mdi:sensor-alert

# Pikud Oref: when on, pre-alert starts the 20 min timer and timer.finished can restore
# snapshot lights. When off, that timer is not started and timeout ignores scene restore.
pikud_timeout_restore:
  name: Pikud Oref – 20 minute auto-restore lights
  initial: false
  icon: mdi:timer-outline

# Set while sync automation writes input_select.main_media (blocks run-script re-trigger).
main_media_sync_guard:
  name: Main Media sync guard
  initial: false
  icon: mdi:sync-off
