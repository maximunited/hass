---

####################################################################
### https://www.home-assistant.io/integrations/google_assistant/ ###
####################################################################

project_id: !secret google_assistant_project_id
service_account: !include SERVICE_ACCOUNT.json
report_state: true
expose_by_default: false
# redirect_uri: https://oauth-redirect.googleusercontent.com
exposed_domains:
  - switch
  - input_boolean
  - sensor
  - script
entity_config:
  light.gateway_light_04cf8c916107:
    name: Gateway light
    expose: true
  script.main_media_chromecast:
    name: Chromecast
    expose: true
    room: Living Room
    aliases:
      - Switch to Chromecast
      - Switch chromecast
      - Script Chromecast
      - Main media Chromecast
  script.main_media_hot:
    name: Cable
    expose: true
    room: Living Room
    aliases:
      - Switch to cable
      - Switch to HOT
      - Switch cable
      - Script Hot
      - Main media cable
  script.main_media_plex:
    name: Plex
    expose: true
    room: Living Room
    aliases:
      - Switch to Plex
      - Switch plex
      - Script Plex
      - Main media Plex
  script.main_media_jellyfin:
    name: Jellyfin
    expose: true
    room: Living Room
    aliases:
      - Switch to Jellyfin
      - Switch jellyfin
      - Script Jellyfin
      - Main media Jellyfin
  script.main_media_stremio:
    name: Stremio
    expose: true
    room: Living Room
    aliases:
      - Switch to Stremio
      - Switch stremio
      - Script Stremio
      - Main media Stremio
  script.main_media_netflix:
    name: Netflix
    expose: true
    room: Living Room
    aliases:
      - Switch to Netflix
      - Switch netflix
      - Script Netflix
      - Main media Netflix
  script.main_media_youtube:
    name: YouTube
    expose: true
    room: Living Room
    aliases:
      - Switch to YouTube
      - Switch youtube
      - Script YouTube
      - Main media YouTube
  script.main_media_youtube_michelle:
    name: YouTube Michelle
    expose: true
    room: Living Room
    aliases:
      - Switch to YouTube Michelle
      - YouTube Kids Michelle
      - Script YouTube Michelle
      - Main media YouTube Michelle
  script.main_media_playstation:
    name: Playstation
    expose: true
    room: Living Room
    aliases:
      - Switch to Playstation
      - Switch playstation
      - Switch to PS5
      - Script Playstation
      - Main media Playstation
  # switch.docker_dockerbot:
  #   name: Dockerbot
  switch.docker_hass:
    name: Home Assisstant
    expose: true
    aliases:
      - hass
  switch.docker_mariadb:
    name: MariaDB
    expose: true
  switch.docker_mosquitto:
    name: Mosquitto
    expose: true
  switch.docker_node_red:
    name: Node-RED
    expose: true
    aliases:
      - Node red
  switch.docker_oauth:
    name: OAuth
    expose: true
  switch.docker_portainer:
    name: Portainer
    expose: true
  switch.docker_traefik:
    name: Traefik
    expose: true
    aliases:
      - Traffic

  # Doesn't work
  # sensor.living_room_temperature:
  #   name: Living room temperature
  # sensor.master_bedroom_temperature:
  #   name: Master bedroom temperature
  # sensor.shower_temperature:
  #   name: Shower temperature
  # sensor.bathroom_temperature:
  #   name: Bathroom temperature
