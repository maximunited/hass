---

# Retention and purge (DB was ~3.9 GB before 2026-08-19 housekeeping).
purge_keep_days: 14
auto_purge: true
commit_interval: 30

exclude:
  domains:
    - automation
    - input_boolean
    - media_player
    - script
    - sun
    - updater
    - weather
    - zone
  entities:
    - sensor.last_boot
    - sensor.date
    - sensor.time
    - sensor.ipv4_address_eth0
    - sensor.jewish_calendar_holiday
    - sensor.jewish_calendar_holyness
