notify_ifttt_ha_started:
  alias: Notify IFTTT HA started
  sequence:
  - data:
      event: HA started
      value1: RPI Home HA
      value2: Test
    service: ifttt.trigger
google_say_indoor_temperature:
  alias: Google say indoor temperature
  sequence:
  - service: tts.google_say
    entity_id: media_player.living_google_home
    data_template:
      message: "{% if (states(\"sensor.master_bedroom_temperature\")|float - states(\"sensor.living_room_temperature\")|float
        ) | abs <= 2.5  -%}\n  The indoor temperature is {{((states(\"sensor.living_room_temperature\")|float
        + states(\"sensor.master_bedroom_temperature\")|float) / 2 ) | round(1) }}\n{%-
        else -%}\n  The temperature in the living room is {{states(\"sensor.living_room_temperature\")
        | float | round(1)}}.\n  The temperature in the master bedroom is {{states(\"sensor.master_bedroom_temperature\")
        | float | round(1)}}.\n{%- endif %}\n"
      cache: false
main_media_hot:
  alias: Main Media HOT
  sequence:
  - parallel:
    - sequence:
      - target:
          entity_id: media_player.marantz_nr1608
        action: media_player.turn_on
        data: {}
      - target:
          entity_id: media_player.marantz_nr1608
        data:
          source: HOT
        action: media_player.select_source
    - target:
        entity_id:
        - media_player.85c855_television
      data:
        source: Cable
      action: media_player.select_source
  - action: input_select.select_option
    metadata: {}
    target:
      entity_id: input_select.main_media
    data:
      option: HOT
main_media_chromecast:
  alias: Main Media Chromecast
  sequence:
  - target:
      entity_id: media_player.marantz_nr1608
    action: media_player.turn_on
  - target:
      entity_id: media_player.living_room_chromecast
    action: media_player.turn_on
  - target:
      entity_id: media_player.marantz_nr1608
    data:
      source: TV Audio
    action: media_player.select_source
  - target:
      entity_id: media_player.lg_tv
    data:
      source: Chromecast
    action: media_player.select_source
  - action: input_select.select_option
    metadata: {}
    target:
      entity_id: input_select.main_media
    data:
      option: Chromecast
main_media_playstation:
  alias: Main Media Playstation
  sequence:
  - entity_id:
    - media_player.marantz_nr1608
    action: media_player.turn_on
  - data:
      source: PlayStation
    action: media_player.select_source
    target:
      entity_id: media_player.marantz_nr1608
  - data:
      entity_id: media_player.lg_tv
      source: Receiver
    action: media_player.select_source
  - action: input_select.select_option
    metadata: {}
    target:
      entity_id: input_select.main_media
    data:
      option: Playstation
main_media_plex:
  alias: Main Media Plex
  sequence:
  - parallel:
    - action: media_player.turn_on
      metadata: {}
      target:
        entity_id: media_player.marantz_nr1608
      data: {}
    - action: media_player.turn_on
      target:
        entity_id: media_player.smart_tv_pro
  - parallel:
    - action: media_player.select_source
      metadata: {}
      target:
        entity_id: media_player.marantz_nr1608
      data:
        source: TV Audio
    - action: remote.turn_on
      target:
        entity_id: remote.tcl_tv
      data:
        activity: com.plexapp.android
  - action: input_select.select_option
    metadata: {}
    target:
      entity_id: input_select.main_media
    data:
      option: Plex
main_media_jellyfin:
  alias: Main Media Jellyfin
  sequence:
  - parallel:
    - action: media_player.turn_on
      metadata: {}
      target:
        entity_id: media_player.marantz_nr1608
      data: {}
    - action: media_player.turn_on
      target:
        entity_id: media_player.tcl_tv
  - parallel:
    - action: media_player.select_source
      metadata: {}
      target:
        entity_id: media_player.marantz_nr1608
      data:
        source: TV Audio
    - action: remote.turn_on
      target:
        entity_id: remote.tcl_tv
      data:
        activity: org.jellyfin.androidtv
  - action: input_select.select_option
    metadata: {}
    target:
      entity_id: input_select.main_media
    data:
      option: Jellyfin
main_media_off:
  alias: Main Media Off
  sequence:
  - entity_id:
    - media_player.living_room_chromecast
    action: media_player.turn_off
  - action: media_player.turn_off
    metadata: {}
    target:
      entity_id: media_player.marantz_nr1608
    data: {}
  - action: input_select.select_option
    metadata: {}
    target:
      entity_id: input_select.main_media
    data:
      option: 'Off'
remount_share_restart_plex:
  alias: Mount Share and restart Plex
  description: Remount /mnt/Share on main host and restart Plex docker container
  icon: mdi:plex
  sequence:
  - service: shell_command.mount_share
  - service: switch.turn_off
    target:
      entity_id: switch.docker_plex
  - wait_for_trigger:
    - platform: state
      entity_id: switch.docker_plex
      to: 'off'
  - service: switch.turn_on
    target:
      entity_id: switch.docker_plex
  - service: notify.notify
    data:
      message: Share mounted and Plex restarted
  mode: restart
do_nothing:
  alias: Do Nothing
  sequence: []
adguard_disable_protection_for_1_hour:
  alias: 'AdGuard: Disable Protection for 1 Hour'
  description: Turns off AdGuard protection and automatically turns it back on after
    60 minutes.
  icon: mdi:shield-off-outline
  mode: single
  sequence:
  - action: switch.turn_off
    metadata: {}
    target:
      entity_id: switch.adguard_home_filtering
    data: {}
  - delay:
      hours: 1
      minutes: 0
      seconds: 0
  - action: switch.turn_on
    metadata: {}
    target:
      entity_id: switch.adguard_home_filtering
    data: {}
m5stick_pikud_bump_sync:
  alias: M5Stick Pikud bump sync counter
  description: Forces sensor.m5stick_pikud_display_state to republish for ESPHome.
  mode: queued
  sequence:
    - action: input_number.set_value
      target:
        entity_id: input_number.m5stick_pikud_sync
      data:
        value: "{{ ((states('input_number.m5stick_pikud_sync') | int(0)) + 1) % 10000 }}"

m5stick_pikud_test_clock:
  alias: M5Stick Pikud test — clock
  description: Show clock on M5Stick only (no Pikud scene automations).
  icon: mdi:clock-outline
  sequence:
    - action: input_select.select_option
      target:
        entity_id: input_select.m5stick_pikud_test_mode
      data:
        option: clock
    - action: script.m5stick_pikud_bump_sync

m5stick_pikud_test_pre_alert:
  alias: M5Stick Pikud test — pre-alert
  description: Orange pre-alert loop on M5Stick only (no Pikud scene automations).
  icon: mdi:alert-outline
  sequence:
    - action: input_select.select_option
      target:
        entity_id: input_select.m5stick_pikud_test_mode
      data:
        option: pre_alert
    - action: script.m5stick_pikud_bump_sync

m5stick_pikud_test_alert:
  alias: M5Stick Pikud test — alert
  description: Red alert loop on M5Stick only (no Pikud scene automations).
  icon: mdi:alert-octagon
  sequence:
    - action: input_select.select_option
      target:
        entity_id: input_select.m5stick_pikud_test_mode
      data:
        option: alert
    - action: script.m5stick_pikud_bump_sync

m5stick_pikud_test_safe:
  alias: M5Stick Pikud test — safe
  description: Green safe loop on M5Stick (5 min max on device), no Pikud scene automations.
  icon: mdi:shield-check
  sequence:
    - action: input_select.select_option
      target:
        entity_id: input_select.m5stick_pikud_test_mode
      data:
        option: ok
    - action: script.m5stick_pikud_bump_sync

m5stick_pikud_test_live:
  alias: M5Stick Pikud test — follow live Oref
  description: M5Stick mirrors sensor.oref_alert again; clears test override.
  icon: mdi:transmission-tower
  sequence:
    - action: input_select.select_option
      target:
        entity_id: input_select.m5stick_pikud_test_mode
      data:
        option: live
    - action: script.m5stick_pikud_bump_sync

take_camera_snapshot_and_notify:
  sequence:
  - data:
      filename: /config/www/imou_life/snapshot_{{ now().strftime('%Y-%m-%d_%H-%M-%S')
        }}.jpg
      response_variable: snapshot_info
    action: camera.snapshot
    target:
      entity_id: camera.garage_camera_hd
  - data:
      title: Snapshot Saved!
      notification_id: snapshot_{{ now().isoformat() }}
      message: Snapshot saved. [Click here to view]({{ snapshot_info.filepath | replace('/config/www',
        '/local') }})
    action: persistent_notification.create
  alias: Take camera snapshot and notify
  description: ''
  icon: mdi:camera-plus-outline
