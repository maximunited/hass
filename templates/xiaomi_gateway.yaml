---
##########################################################
### Template sensors for Xiaomi Gateway              ###
##########################################################

- sensor:
  - name: vibration_living_room_ac
    state: >-
      {% if states.binary_sensor.vibration_living_room_ac is not none and states.binary_sensor.vibration_living_room_ac.attributes is defined %}
        {{ states.binary_sensor.vibration_living_room_ac.attributes.get("last_action", "unknown") }}
      {% else %}
        unknown
      {% endif %}

  - name: front_door
    state: >-
      {% if states.binary_sensor.front_door.state == 'on' %}
        Open
      {% elif states.binary_sensor.front_door.state == 'off' %}
        Closed
      {% else %}
        n/a
      {% endif %}
    icon: >-
      {% if states.binary_sensor.front_door.state == 'on' %}
        mdi:door-open
      {% elif states.binary_sensor.front_door.state == 'off' %}
        mdi:door-closed
      {% else %}
        mdi:help
      {% endif %}

  - name: balcony_door
