# templates/oref.yaml

# 1. Trigger-based sensors (start / duration / ETA)
- trigger:
    - platform: state
      entity_id: sensor.oref_alert
      to: "pre_alert"
    - platform: state
      entity_id: sensor.oref_alert
      from: "pre_alert"
    - platform: time_pattern
      seconds: "/5"
  sensor:
    - name: "Oref Pre Alert Start"
      unique_id: oref_pre_alert_start
      state: >
        {% if trigger.platform == 'state'
              and trigger.to_state is not none
              and trigger.to_state.state == 'pre_alert' %}
          {{ now().timestamp() }}
        {% else %}
          {{ this.state | default(0) }}
        {% endif %}

    - name: "Oref Pre Alert Duration"
      unique_id: oref_pre_alert_duration
      unit_of_measurement: "s"
      state_class: measurement
      state: >
        {% set s = states('sensor.oref_pre_alert_start') | float(0) %}
        {% if s == 0 or not is_state('sensor.oref_alert','pre_alert') %}
          0
        {% else %}
          {{ (now().timestamp() - s) | int }}
        {% endif %}

    - name: "Oref Pre Alert ETA"
      unique_id: oref_pre_alert_eta
      unit_of_measurement: "s"
      state_class: measurement
      state: >
        {% set avg = states('sensor.oref_pre_alert_avg_3d') | int(0) %}
        {% set s = states('sensor.oref_pre_alert_start') | float(0) %}
        {% if is_state('sensor.oref_alert','pre_alert') and avg > 0 and s > 0 %}
          {% set elapsed = now().timestamp() - s %}
          {% set remaining = avg - elapsed %}
          {{ [remaining, 0] | max | int }}
        {% else %}
          0
        {% endif %}

# 2. Min / Max / Avg 3d sensors (no triggers needed)
- sensor:
    - name: "Oref Pre Alert Min 3d"
      unique_id: oref_pre_alert_min_3d
      unit_of_measurement: "s"
      state_class: measurement
      state: >
        {{ state_attr('sensor.oref_pre_alert_stats_3d', 'min_value') | int(0) }}

    - name: "Oref Pre Alert Max 3d"
      unique_id: oref_pre_alert_max_3d
      unit_of_measurement: "s"
      state_class: measurement
      state: >
        {{ state_attr('sensor.oref_pre_alert_stats_3d', 'max_value') | int(0) }}

    - name: "Oref Pre Alert Avg 3d"
      unique_id: oref_pre_alert_avg_3d
      unit_of_measurement: "s"
      state_class: measurement
      state: >
        {{ state_attr('sensor.oref_pre_alert_stats_3d', 'mean') | int(0) }}

