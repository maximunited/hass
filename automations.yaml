# -----------------------------------------------------------------------------
# Network — unknown / new device_tracker discovery alerts
# -----------------------------------------------------------------------------
- id: notify_on_unknown_devices_home
  alias: Notify when unknown devices are marked home
  description: Notify when a specific unknown MAC appears as home on network.
  trigger:
  - platform: state
    entity_id:
    - device_tracker.6c_c7_ec_da_ff_9f
    to: home
    from: not_home
  action:
  - service: notify.telegram_bot
    data:
      title: '*Unknown device is home*'
      message: 'MAC: {{ trigger.to_state.attributes.friendly_name | upper | replace("_",
        ":") }} Detected by: {{ trigger.to_state.attributes.source }}'
  - service: persistent_notification.create
    data:
      title: '*Unknown device is home*'
      message: 'MAC: {{ trigger.to_state.attributes.friendly_name | upper | replace("_",
        ":") }} Detected by: {{ trigger.to_state.attributes.source }}'
  mode: single
- id: notify_new_devices
  alias: Notify for new devices
  description: Notify on any newly discovered device_tracker entity.
  trigger:
  - platform: event
    event_type: device_tracker_new_device
  action:
  - service: persistent_notification.create
    data:
      title: 'Newly tracked: {{ trigger.event.data.entity_id }}'
      message: 'New device tracked: ({{ trigger.event.data.entity_id }}) Host: {{
        trigger.event.data.host_name }} Mac-address: {{ trigger.event.data.mac }}
        Data: {{ trigger.event.data }}'
  - service: notify.notify_html5
    data:
      title: New device
      message: 'New device: {{ trigger.event.data.host_name }} ({{ trigger.event.data.entity_id}})'
  - service: notify.telegram_bot
    data:
      title: Home Assistant
      message: 'New device: {{ trigger.event.data.host_name }} ({{ trigger.event.data.entity_id}}) Mac: {{ trigger.event.data.mac }}'

# -----------------------------------------------------------------------------
