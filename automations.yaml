# -----------------------------------------------------------------------------
# IFTTT — webhooks (generic service forwarders + living AC toggle)
# -----------------------------------------------------------------------------
- id: ifttt_toggle_living_ac_boolean
  alias: Turn ON or OFF input_boolean.living_ac from IFTTT
  description: Allow IFTTT webhook to control living_ac boolean or other entities.
  trigger:
  - platform: event
    event_type: ifttt_webhook_received
    event_data:
      action: call_service
  condition:
  - condition: template
    value_template: '{% if trigger.event.data.title is not defined %}True{% else %}False{%
      endif %}

      '
  - condition: template
    value_template: '{% if trigger.event.data.entity_id is defined %}True{% else %}False{%
      endif %}

      '
  action:
  - service: '{{ trigger.event.data.service | lower }}'
    data:
      entity_id: '{{ trigger.event.data.entity_id | lower }}'
- id: ifttt_report_indoor_temperature
  alias: Report indoor temperature from IFTTT (Google Home)
  description: Generic IFTTT service forwarder for indoor temperature queries.
  trigger:
  - platform: event
    event_type: ifttt_webhook_received
    event_data:
      action: call_service
  condition:
  - condition: template
    value_template: '{% if trigger.event.data.title is not defined %}True{% else %}False{%
      endif %}

      '
  - condition: template
    value_template: '{% if trigger.event.data.entity_id is not defined %}True{% else
      %}False{% endif %}

      '
  action:
  - service: '{{ trigger.event.data.service | lower }}'

# -----------------------------------------------------------------------------
# Home Assistant — startup, updater, Docker image tag change notifications
# -----------------------------------------------------------------------------
- id: ha_startup_notification_ifttt
  alias: Startup Notification
  description: Send IFTTT event when Home Assistant starts.
  trigger:
  - platform: homeassistant
    event: start
  action:
  - service: ifttt.trigger
    data:
      event: HA event
      value1: Home Assistant started
- id: ha_update_available_html5
  alias: Update Available Notifications
  description: Send HTML5 notification when core update is available.
  trigger:
  - platform: state
    entity_id: updater.updater
  action:
  - service: notify.notify_html5
    data:
      title: Home Assistant
      message: Update for HA is available.
- id: ha_docker_tag_changed_simple
  alias: Notify - Home Assistant docker tag changed (simple)
  description: Notify when tracked Docker tag (sensor.docker_version_available) changes.
  trigger:
  - platform: state
    entity_id: sensor.docker_version_available
  condition:
  - condition: template
    value_template: '{{ trigger.to_state.state not in [trigger.from_state.state, ''unavailable'']
      }}

      '
  action:
  - service: persistent_notification.create
    data:
      title: Home Assistant update available
      message: 'Home Assistant docker tag changed from {{ trigger.from_state.state
        }} to {{ trigger.to_state.state }}

        '
  - service: notify.notify_html5
    data:
      title: Home Assistant update available
      message: 'Home Assistant docker tag changed from {{ trigger.from_state.state
        }} to {{ trigger.to_state.state }}

        '
- id: ha_docker_tag_changed_var
  alias: Notify - Home Assistant docker tag changed (var-based)
  description: 'Compare latest_docker_version with var.ha_version_notification and
    notify when an update is available, also writing release links.

    '
  trigger:
  - platform: state
    entity_id:
    - sensor.latest_docker_version
  - platform: homeassistant
    event: start
  condition:
  - condition: template
    value_template: "{{ states.sensor.latest_docker_version.state not in\n   [states.var.ha_version_notification.state,
      'unavailable'] }}\n"
  - condition: template
    value_template: "{{ states.var.ha_version_notification.state !=\n   states.sensor.latest_docker_version.state
      }}\n"
  action:
  - service: persistent_notification.create
    data:
      title: Home Assistant update available
      message: "Home Assistant docker image tag changed {% if trigger.entity_id ==
        'sensor.latest_docker_version' -%}\n  \\n  from {{ trigger.from_state.state
        }}\n{% endif -%} \\n  to {{ states.sensor.latest_docker_version.state }} \\n{%
        if states('sensor.latest_docker_version').split('.')[-1] == '0' -%} \\n  [Release
        notes](https://www.home-assistant.io/latest-release-notes/) \\n{% else -%}
        \\n  [Release notes](https://github.com/home-assistant/core/releases/tag/{{
        states('sensor.latest_docker_version') }}) \\n{% endif %}\n"
  - service: notify.notify_html5
    data:
      title: Home Assistant update available
      message: "Home Assistant docker image tag changed {% if trigger.entity_id ==
        'sensor.latest_docker_version' -%}\n  \\n  from {{ trigger.from_state.state
        }}\n{% endif -%} \\n  to {{ states.sensor.latest_docker_version.state }} \\n{%
        if states('sensor.latest_docker_version').split('.')[-1] == '0' -%} \\n  [Release
        notes](https://www.home-assistant.io/latest-release-notes/) \\n{% else -%}
        \\n  [Release notes](https://github.com/home-assistant/core/releases/tag/{{
        states('sensor.latest_docker_version') }}) \\n{% endif %}\n"
  - service: var.set
    data:
      entity_id: var.ha_version_notification
      value: '{{ states.sensor.latest_docker_version.state }}'
      icon: mdi:bell-sleep
  mode: single

# -----------------------------------------------------------------------------
# HACS — new repos and pending integration updates
# -----------------------------------------------------------------------------
- id: hacs_notify_new_repo
  alias: Create a notification when something is added to HACS
  description: Persistent notification when a new HACS repository is registered.
  trigger:
  - platform: event
    event_type: hacs/repository
    event_data:
      action: registration
  condition:
  - condition: template
    value_template: '{{ trigger.event.data.repository is defined }}'
  action:
  - service: persistent_notification.create
    data:
      title: New repository in HACS
      message: '{% set repo = trigger.event.data.repository %} {% set id = trigger.event.data.repository_id
        %} [{{ repo }}](/hacs/repository/{{ id }}) was just added to HACS.

        '
  mode: single
- id: hacs_notify_updates
  alias: Create a notification when there is updates pending in HACS
  description: Notify when HACS sensor indicates pending updates.
  trigger:
  - platform: state
    entity_id: sensor.hacs
  condition:
  - condition: template
    value_template: '{{ states(trigger.entity_id) != ''unknown'' }}'
  - condition: template
    value_template: '{{ (states(trigger.entity_id) | float) != 0 }}'
  action:
  - service: persistent_notification.create
    data:
      title: Updates pending in HACS
      message: "{% for repo in state_attr(trigger.entity_id, 'repositories') %}\n
        \ **{{ repo.display_name }}** _{{ repo[\"installed_version\"] }}_\n  => _{{
        repo[\"available_version\"] }}_\n{% endfor %}\n"
  mode: single

# -----------------------------------------------------------------------------
# DDNS & HTML5 — DuckDNS failure alerts; notification action logging (Shelly FW)
# -----------------------------------------------------------------------------
- id: duckdns_update_failed
  alias: DuckDNS update script failed notification
  description: Check if duckdns update script has been failing for 90 minutes.
  trigger:
  - platform: state
    entity_id: binary_sensor.duckdns_update_problem
    to: 'on'
    for: 01:30:00
  condition: []
  action:
  - service: notify.telegram_bot
    data:
      title: '*DuckDNS cron update is failing!*'
      message: 'duck.sh update script is failing for 90m '
  mode: single
- id: html5_notification_clicked_update_fw
  alias: 'Handle HTML5 notification action: Update FW'
  description: Log when a Shelly firmware update notification action is clicked.
  initial_state: true
  trigger:
  - platform: event
    event_type: html5_notification.clicked
    event_data:
      action: update_shelly_fw
  action:
  - service: system_log.write
    data:
      message: Clicked {{ trigger.event.data }}
      level: info

# -----------------------------------------------------------------------------
# Sensor health — periodic battery audit, missing sensors, speedtest peak tracking
# -----------------------------------------------------------------------------
- id: low_battery_check_all_sensors
  alias: Low battery level detection & notification for all battery sensors
  description: Check all battery sensors hourly and create a low battery summary.
  trigger:
  - platform: time_pattern
    hours: 1
  condition: []
  action:
  - service: persistent_notification.create
    data:
      title: Low Battery Alert
      message: "{% set low_battery_sensors = [] %} {% for state in states.sensor %}\n
        \ {% if \"battery\" in state.entity_id.lower()\n        and state.state !=
        \"unavailable\"\n        and state.state != \"unknown\" %}\n    {% set battery_level
        = state.state | float %}\n    {% if battery_level < 20 %}\n      {% set low_battery_sensors
        =\n           low_battery_sensors + [state.entity_id ~ \" (\" ~ state.state
        ~ \"%)\"] %}\n    {% endif %}\n  {% endif %}\n{% endfor %} {% if low_battery_sensors
        %}\n  The following sensors have low battery levels:\n  {% for sensor in low_battery_sensors
        %}\n  - {{ sensor }}\n  {% endfor %}\n{% else %}\n  All battery sensors are
        at acceptable levels.\n{% endif %}\n"
- id: notify_missing_sensors
  alias: Notify Missing Sensors
  description: List sensors that have been unavailable for more than 2 weeks.
  trigger:
  - platform: state
    entity_id: input_boolean.notify_missing_sensors
    to: 'on'
  action:
  - service: persistent_notification.create
    data:
      title: Missing Sensors
      message: "{% set threshold = now().timestamp() - (14 * 86400) %} {% set missing_sensors
        = [] %} {% for state in states.sensor\n     if state.state == \"unavailable\"\n
        \    and state.last_updated.timestamp() < threshold %}\n  {% set missing_sensors
        = missing_sensors + [state.entity_id] %}\n{% endfor %} {% if missing_sensors
        %}\n  The following sensors have not reported data in the past 2 weeks:\n
        \ {% for entity_id in missing_sensors %}\n  - {{ entity_id }}\n  {% endfor
        %}\n{% else %}\n  All sensors are reporting data as expected.\n{% endif %}\n"
- id: track_speedtest_maximum_download
  alias: Track SpeedTest Maximum Download
  description: Update max_download_speed input_number when speedtest_download beats
    it.
  trigger:
  - platform: time_pattern
    hours: 1
  condition:
  - condition: template
    value_template: "{{ states('sensor.speedtest_download') | float >\n   states('input_number.max_download_speed')
      | float }}\n"
  action:
  - service: input_number.set_value
    data:
      entity_id: input_number.max_download_speed
      value: '{{ states(''sensor.speedtest_download'') }}'
  mode: single

# -----------------------------------------------------------------------------
# Misc notifications — sports scores, No-IP renewal counter
# -----------------------------------------------------------------------------
- id: notify_maccabi_scores
  alias: Notify when Maccabi scores
  description: Notify when Maccabi team_score increases on tt_maccabi_fc sensor.
  trigger:
  - platform: state
    entity_id:
    - sensor.tt_maccabi_fc
