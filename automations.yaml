- id: '1774986352971'
  alias: Main Media - Run script from helper
  triggers:
  - entity_id: input_select.main_media
    to:
    trigger: state
  conditions:
  - condition: template
    value_template: "{{ trigger.from_state is not none and trigger.to_state is not
      none and\n   trigger.from_state.state != trigger.to_state.state }}\n"
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_select.main_media
        state: Plex
      sequence:
      - action: script.main_media_plex
    - conditions:
      - condition: state
        entity_id: input_select.main_media
        state: Jellyfin
      sequence:
      - action: script.main_media_jellyfin
    - conditions:
      - condition: state
        entity_id: input_select.main_media
        state: Chromecast
      sequence:
      - action: script.main_media_chromecast
    - conditions:
      - condition: state
        entity_id: input_select.main_media
        state: HOT
      sequence:
      - action: script.main_media_hot
    - conditions:
      - condition: state
        entity_id: input_select.main_media
        state: Playstation
      sequence:
      - action: script.main_media_playstation
    - conditions:
      - condition: state
        entity_id: input_select.main_media
        state: 'Off'
      sequence:
      - action: script.main_media_off
  mode: single
- id: '1774988148886'
  alias: Main Media - Sync helper from devices
  description: Sync input_select.main_media from AVR/TV actual state
  triggers:
  - entity_id:
    - media_player.marantz_nr1608
    - media_player.85c855_television
    - media_player.tcl_tv
    - media_player.tcl_tv_2
    to:
    trigger: state
  actions:
  - variables:
      detected_now: "{% set avr_state = states('media_player.marantz_nr1608') %} {%
        set avr_source = state_attr('media_player.marantz_nr1608', 'source') | default('',
        true) %}\n{% set tv_state = states('media_player.85c855_television') %} {%
        set tv_source = state_attr('media_player.85c855_television', 'source') | default('',
        true) %}\n{% set tcl_state = states('media_player.tcl_tv') %} {% set tcl_source
        = state_attr('media_player.tcl_tv', 'source') | default('', true) %} {% set
        tcl_app_name = state_attr('media_player.tcl_tv', 'app_name') | default('',
        true) %} {% set tcl_app_id = state_attr('media_player.tcl_tv', 'app_id') |
        default('', true) %} {% set tcl_media_title = state_attr('media_player.tcl_tv',
        'media_title') | default('', true) %}\n{% set jellyfin_state = states('media_player.tcl_tv_2')
        %}\n{% set app_text = (\n  tcl_app_name ~ ' ' ~\n  tcl_app_id ~ ' ' ~\n  tcl_media_title
        ~ ' ' ~\n  tcl_source\n) | lower %}\n{% if avr_state == 'off' and tv_state
        == 'off' %}\n  Off\n{% elif avr_source == 'HOT' and tv_source == 'Cable' %}\n
        \ HOT\n{% elif avr_source == 'TV Audio' and 'jellyfin' in app_text %}\n  Jellyfin\n{%
        elif avr_source == 'TV Audio' and 'plex' in app_text %}\n  Plex\n{% elif avr_source
        == 'TV Audio' and (\n      'chromecast' in app_text\n      or 'cast' in app_text\n
        \   ) %}\n  Chromecast\n{% elif 'playstation' in (avr_source | lower)\n      or
        'ps5' in (avr_source | lower)\n      or 'playstation' in (tv_source | lower)\n
        \     or 'ps5' in (tv_source | lower) %}\n  Playstation\n{% elif avr_source
        == 'TV Audio' and jellyfin_state not in ['off', 'idle', 'standby', 'unavailable',
        'unknown'] %}\n  Jellyfin\n{% else %}\n  __NO_MATCH__\n{% endif %}"
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ detected_now != ''__NO_MATCH__'' }}'
      sequence:
      - condition: template
        value_template: '{{ states(''input_select.main_media'') != detected_now }}'
      - action: input_select.select_option
        target:
          entity_id: input_select.main_media
        data:
          option: '{{ detected_now }}'
    default:
    - wait_template: "{% set avr_state = states('media_player.marantz_nr1608') %}
        {% set avr_source = state_attr('media_player.marantz_nr1608', 'source') |
        default('', true) %}\n{% set tv_state = states('media_player.85c855_television')
        %} {% set tv_source = state_attr('media_player.85c855_television', 'source')
        | default('', true) %}\n{% set tcl_source = state_attr('media_player.tcl_tv',
        'source') | default('', true) %} {% set tcl_app_name = state_attr('media_player.tcl_tv',
        'app_name') | default('', true) %} {% set tcl_app_id = state_attr('media_player.tcl_tv',
        'app_id') | default('', true) %} {% set tcl_media_title = state_attr('media_player.tcl_tv',
        'media_title') | default('', true) %}\n{% set jellyfin_state = states('media_player.tcl_tv_2')
        %}\n{% set app_text = (\n  tcl_app_name ~ ' ' ~\n  tcl_app_id ~ ' ' ~\n  tcl_media_title
        ~ ' ' ~\n  tcl_source\n) | lower %}\n{{\n  (avr_state == 'off' and tv_state
        == 'off')\n  or (avr_source == 'HOT' and tv_source == 'Cable')\n  or (avr_source
        == 'TV Audio' and 'jellyfin' in app_text)\n  or (avr_source == 'TV Audio'
        and 'plex' in app_text)\n  or (avr_source == 'TV Audio' and ('chromecast'
        in app_text or 'cast' in app_text))\n  or ('playstation' in (avr_source |
        lower))\n  or ('ps5' in (avr_source | lower))\n  or ('playstation' in (tv_source
        | lower))\n  or ('ps5' in (tv_source | lower))\n  or (avr_source == 'TV Audio'
        and jellyfin_state not in ['off', 'idle', 'standby', 'unavailable', 'unknown'])\n}}"
      timeout: 00:00:05
      continue_on_timeout: true
    - variables:
        detected_after_wait: "{% set avr_state = states('media_player.marantz_nr1608')
          %} {% set avr_source = state_attr('media_player.marantz_nr1608', 'source')
          | default('', true) %}\n{% set tv_state = states('media_player.85c855_television')
          %} {% set tv_source = state_attr('media_player.85c855_television', 'source')
          | default('', true) %}\n{% set tcl_source = state_attr('media_player.tcl_tv',
          'source') | default('', true) %} {% set tcl_app_name = state_attr('media_player.tcl_tv',
          'app_name') | default('', true) %} {% set tcl_app_id = state_attr('media_player.tcl_tv',
          'app_id') | default('', true) %} {% set tcl_media_title = state_attr('media_player.tcl_tv',
          'media_title') | default('', true) %}\n{% set jellyfin_state = states('media_player.tcl_tv_2')
          %}\n{% set app_text = (\n  tcl_app_name ~ ' ' ~\n  tcl_app_id ~ ' ' ~\n
          \ tcl_media_title ~ ' ' ~\n  tcl_source\n) | lower %}\n{% if avr_state ==
          'off' and tv_state == 'off' %}\n  Off\n{% elif avr_source == 'HOT' and tv_source
          == 'Cable' %}\n  HOT\n{% elif avr_source == 'TV Audio' and 'jellyfin' in
          app_text %}\n  Jellyfin\n{% elif avr_source == 'TV Audio' and 'plex' in
          app_text %}\n  Plex\n{% elif avr_source == 'TV Audio' and (\n      'chromecast'
          in app_text\n      or 'cast' in app_text\n    ) %}\n  Chromecast\n{% elif
          'playstation' in (avr_source | lower)\n      or 'ps5' in (avr_source | lower)\n
          \     or 'playstation' in (tv_source | lower)\n      or 'ps5' in (tv_source
          | lower) %}\n  Playstation\n{% elif avr_source == 'TV Audio' and jellyfin_state
          not in ['off', 'idle', 'standby', 'unavailable', 'unknown'] %}\n  Jellyfin\n{%
          else %}\n  Unknown\n{% endif %}"
    - condition: template
      value_template: '{{ states(''input_select.main_media'') != detected_after_wait
        }}'
    - action: input_select.select_option
      target:
        entity_id: input_select.main_media
      data:
        option: '{{ detected_after_wait }}'
  mode: restart
