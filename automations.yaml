- id: pikud_pre_alert_start
  alias: Pikud Oref - Enter pre-alert state
  description: When Oref changes to pre_alert, snapshot current lighting if no Pikud
    scene is active, activate the Pre-Alert scene and enforce a 20-minute cap.
  triggers:
  - entity_id: sensor.oref_alert
    to: pre_alert
    trigger: state
  actions:
  - if:
    - condition: state
      entity_id: input_boolean.pikud_scene_active
      state: 'off'
    then:
    - data:
        scene_id: pikud_original_lights
        snapshot_entities:
        - light.curtain_light
        - light.peninsula_light
        - light.stove_light
        - light.gateway_light_04cf8c916107
        - light.cabinet_light
      action: scene.create
    - if:
      - condition: template
        value_template: '{{ states(''scene'' ~ ''.'' ~ ''pikud_original_lights'') not in
          [''unknown'', ''unavailable''] }}'
      then:
      - action: input_text.set_value
        target:
          entity_id: input_text.pikud_original_snapshot_scene
        data:
          value: "{{ 'scene' ~ '.' ~ 'pikud_original_lights' }}"
  - target:
      entity_id: input_boolean.pikud_scene_active
    action: input_boolean.turn_on
  - data:
      entity_id: timer.pikud_scene_timeout
      duration: 00:20:00
    action: timer.start
  - sequence:
    - target:
        entity_id: scene.pre_alert_pikud
      action: scene.turn_on
    - action: ntfy.publish
      metadata: {}
      data:
        message: Pre-alert for {{ trigger.to_state.attributes.area | default('your
          area') }}. Prepare to enter a sheltered area and follow official instructions.
        title: 'Oref: Pre-Alert'
        priority: '5'
        icon: https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f7e0.png
      target:
        entity_id: notify.pikud_oref
    - action: notify.pushbullet
      data:
        title: 'Oref: Pre-Alert'
        message: Pre-alert for {{ trigger.to_state.attributes.area | default('your
          area') }}. Prepare to enter a sheltered area and follow official instructions.
      enabled: false
  mode: restart
- id: pikud_alert_start
  alias: Pikud Oref - Enter alert state
  description: When Oref changes to alert, snapshot original lights only if no Pikud
    scene is active yet, then activate the Alert scene.
  triggers:
  - entity_id: sensor.oref_alert
    to: alert
    trigger: state
  actions:
  - if:
    - condition: state
      entity_id: input_boolean.pikud_scene_active
      state: 'off'
    then:
    - data:
        scene_id: pikud_original_lights
        snapshot_entities:
        - light.curtain_light
        - light.peninsula_light
        - light.stove_light
        - light.gateway_light_04cf8c916107
        - light.cabinet_light
      action: scene.create
    - if:
      - condition: template
        value_template: '{{ states(''scene'' ~ ''.'' ~ ''pikud_original_lights'') not in
          [''unknown'', ''unavailable''] }}'
      then:
      - action: input_text.set_value
        target:
          entity_id: input_text.pikud_original_snapshot_scene
        data:
          value: "{{ 'scene' ~ '.' ~ 'pikud_original_lights' }}"
  - target:
      entity_id: input_boolean.pikud_scene_active
    action: input_boolean.turn_on
  - parallel:
    - target:
        entity_id: scene.alert_pikud
      action: scene.turn_on
    - action: ntfy.publish
      metadata: {}
      data:
        message: 'ALERT for {{ trigger.to_state.attributes.area | default(''your area'')
          }}.  Move to a protected area immediately. Time to reach shelter: {{ state_attr(''sensor.oref_alert_time_to_shelter'',
          ''time_to_shelter'') | default(''?'', true) }}{{ state_attr(''sensor.oref_alert_time_to_shelter'',
          ''unit_of_measurement'') | default(''s'', true) }}. Stay in shelter for
          at least 10 minutes, or until an official “Safe to leave” notice.'
        priority: '5'
        title: 'Oref: ALERT !!! פקע"ר'
        icon: https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f534.png
      target:
        entity_id: notify.pikud_oref
    - action: notify.pushbullet
      metadata: {}
      data:
        message: 'ALERT for {{ trigger.to_state.attributes.area | default(''your area'')
          }}.  Move to a protected area immediately. Time to reach shelter: {{ state_attr(''sensor.oref_alert_time_to_shelter'',
          ''time_to_shelter'') | default(''?'', true) }} {{ state_attr(''sensor.oref_alert_time_to_shelter'',
          ''unit_of_measurement'') | default(''s'', true) }}. Stay in shelter for
          at least 10 minutes, or until an official “Safe to leave” notice.'
        title: 'Oref: ALERT !!!'
      enabled: false
  mode: restart
- id: pikud_safe_start
  alias: Pikud Oref - Enter safe state
  description: When Oref changes to ok, cancel the pre-alert timeout timer (so it cannot
    fire later and override the safe scene), apply the Safe scene, clear any snapshot
    reference, and turn off Pikud scene control so ambient and other lighting can resume.
    Original lights are restored only by the pre-alert timer path (once per event), not
    after safe.
  triggers:
  - entity_id: sensor.oref_alert
    to: ok
    trigger: state
  actions:
  - target:
      entity_id: timer.pikud_scene_timeout
    action: timer.cancel
  - target:
      entity_id: scene.safe_pikud
    action: scene.turn_on
  - action: input_text.set_value
    target:
      entity_id: input_text.pikud_original_snapshot_scene
    data:
      value: ''
  - target:
      entity_id: input_boolean.pikud_scene_active
    action: input_boolean.turn_off
  - parallel:
    - action: ntfy.publish
      metadata: {}
      data:
        priority: '4'
        title: 'SAFE TO LEAVE: פקע"ר'
        message: 'Safe to leave shelter for {{ trigger.to_state.attributes.area |
          default(''your area'') }}.

          Unless instructed otherwise, you may exit protected areas carefully.'
        icon: https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f7e2.png
      target:
        entity_id: notify.pikud_oref
    - action: notify.pushbullet
      metadata: {}
      data:
        message: 'Safe to leave shelter for {{ trigger.to_state.attributes.area |
          default(''your area'') }}.

          Unless instructed otherwise, you may exit protected areas carefully.'
        title: 'Oref: Safe to exit: פקע"ר'
      enabled: false
  mode: restart
- id: pikud_timeout_restore_original
  alias: Pikud Oref - Restore original lights on timeout
  triggers:
  - event_type: timer.finished
    event_data:
      entity_id: timer.pikud_scene_timeout
    trigger: event
  actions:
  - variables:
      pikud_snap_scene: '{{ states(''input_text.pikud_original_snapshot_scene'') }}'
  - if:
    - condition: template
      value_template: '{{ pikud_snap_scene | length > 0 and states(pikud_snap_scene) not
        in [''unknown'', ''unavailable''] }}'
    then:
    - target:
        entity_id: '{{ pikud_snap_scene }}'
      action: scene.turn_on
  - action: input_text.set_value
    target:
      entity_id: input_text.pikud_original_snapshot_scene
    data:
      value: ''
  - target:
      entity_id: input_boolean.pikud_scene_active
    action: input_boolean.turn_off
  - if:
    - condition: state
      entity_id: input_boolean.pikud_ambient_pending
      state: 'on'
    - condition: state
      entity_id: group.household
      state: home
    then:
    - target:
        entity_id: scene.ambient_full
      action: scene.turn_on
    - target:
        entity_id: input_boolean.pikud_ambient_pending
      action: input_boolean.turn_off
  mode: single
- id: ambient_lights_sunset_household_home
  alias: Ambient lights on if someone is home
  description: Turn on ambient scene 30 minutes before sunset when anyone is home.
  triggers:
  - event: sunset
    offset: -00:30:00
    trigger: sun
  conditions:
  - condition: state
    entity_id: group.household
    state: home
  actions:
  - if:
    - condition: state
      entity_id: input_boolean.pikud_scene_active
      state: 'off'
    then:
    - target:
        entity_id: scene.ambient_full
      action: scene.turn_on
    - target:
        entity_id: input_boolean.pikud_ambient_pending
      action: input_boolean.turn_off
    else:
    - target:
        entity_id: input_boolean.pikud_ambient_pending
      action: input_boolean.turn_on
  mode: single
- id: boos_home_notify_pushbullet
  alias: Boo's home
  description: Notify Maxim on Pushbullet when Dana arrives home and Maxim is away.
  triggers:
  - entity_id: person.dana
    from: not_home
    to: home
    trigger: state
  conditions:
  - condition: state
    entity_id: person.maxim
    state: not_home
  - condition: time
    after: '12:00:00'
    before: '23:00:00'
  actions:
  - data:
      target: device/Samsung S20 FE 5G (SM-G781B)
      message: Boo's home! She has been away since {{ as_timestamp(states.person.dana.last_changed)
        | timestamp_custom('%H:%M:%S') }}
    action: notify.pushbullet
    enabled: false
  - action: ntfy.publish
    metadata: {}
    data:
      message: Boo's home! She has been away since {{ as_timestamp(states.person.dana.last_changed)
        | timestamp_custom('%H:%M:%S') }}
- id: bedroom_ac_notify_on_openings
  alias: Bedroom AC - Notify if doors or window open
  description: If bedroom AC vent has been on for 5 minutes and any relevant door/window
    is open, send a Telegram notification to avoid wasting electricity.
  trigger:
  - platform: state
    entity_id: binary_sensor.master_bedroom_ac_vent
    to: 'on'
    for: 00:05:00
  - platform: state
    entity_id: binary_sensor.shower_door
    to: 'on'
    for: 00:05:00
  - platform: state
    entity_id: binary_sensor.shower_window
    to: 'on'
    for: 00:05:00
  - platform: state
    entity_id: binary_sensor.master_bedroom_door
    to: 'on'
    for: 00:05:00
  condition:
  - condition: state
    entity_id: binary_sensor.master_bedroom_ac_vent
    state: 'on'
  - condition: not
    conditions:
    - condition: and
      conditions:
      - condition: state
        entity_id: binary_sensor.master_bedroom_door
        state: 'off'
      - condition: or
        conditions:
        - condition: state
          entity_id: binary_sensor.shower_door
          state: 'off'
        - condition: state
          entity_id: binary_sensor.shower_window
          state: 'off'
  action:
  - service: notify.telegram_bot
    data:
      title: '*You''re wasting electricity!*'
      message: "Master bedroom AC is on! {%- if is_state(\"binary_sensor.master_bedroom_door\",
        \"on\") %}\n  {{- \"Please close master bedroom door\" }}\n  {%- if is_state(\"binary_sensor.shower_door\",
        \"on\")\n      and is_state(\"binary_sensor.shower_window\", \"on\") -%}\n
        \     {{ \" and close either the shower door or window\" }}\n  {%- endif %}\n{%-
        elif is_state(\"binary_sensor.shower_door\", \"on\")\n       and is_state(\"binary_sensor.shower_window\",
        \"on\") %}\n  {{- \" Please close the shower door or window\" }}\n{%- else
        %}\n  State combination unexpected.\n{%- endif %}\n"
  mode: single
- id: living_ac_activated
  alias: Living room AC - vibration detected
  description: Start 5-minute timer and mark living AC boolean when unit vibrates.
  trigger:
  - platform: event
    event_type: xiaomi_aqara.movement
    event_data:
      entity_id: binary_sensor.vibration_living_room_ac
      movement_type: vibrate
  action:
  - service: timer.start
    target:
      entity_id: timer.living_ac_5min
  - service: input_boolean.turn_on
    target:
      entity_id: input_boolean.living_ac
  mode: single
- id: living_ac_stopped
  alias: Living room AC - stopped after timer
  description: Clear living AC boolean when timer finishes.
  trigger:
  - platform: event
    event_type: timer.finished
    event_data:
      entity_id: timer.living_ac_5min
  condition:
  - condition: state
    entity_id: input_boolean.living_ac
    state: 'on'
  action:
  - service: input_boolean.turn_off
    target:
      entity_id: input_boolean.living_ac
  mode: single
- id: shower_heater_max_power
  alias: Set shower heater max power state
  description: Mark shower heater as Max Power when consumption exceeds 2000 W.
  trigger:
  - platform: numeric_state
    entity_id: sensor.shower_heater_power
    above: 2000
  condition:
  - condition: or
    conditions:
    - condition: state
      entity_id: sensor.shower_heater_status
      state: Idle
    - condition: state
      entity_id: sensor.shower_heater_status
      state: Power Off
    - condition: state
      entity_id: sensor.shower_heater_status
      state: Low Power
    - condition: state
      entity_id: sensor.shower_heater_status
      state: Light Only
  action:
  - service: input_select.select_option
    data:
      entity_id: input_select.shower_heater_status
      option: Max Power
- id: shower_heater_low_power
  alias: Set shower heater low power state
  description: Mark shower heater as Low Power between 1000 W and 2000 W.
  trigger:
  - platform: numeric_state
    entity_id: sensor.shower_heater_power
    above: 1000
    below: 2000
  condition:
  - condition: or
    conditions:
    - condition: state
      entity_id: sensor.shower_heater_status
      state: Idle
    - condition: state
      entity_id: sensor.shower_heater_status
      state: Power Off
    - condition: state
      entity_id: sensor.shower_heater_status
      state: Max Power
    - condition: state
      entity_id: sensor.shower_heater_status
      state: Light Only
  action:
  - service: input_select.select_option
    data:
      entity_id: input_select.shower_heater_status
      option: Low Power
- id: shower_heater_light_only
  alias: Set shower heater light only state
  description: Mark shower heater as Light Only when minimal power is drawn.
  trigger:
  - platform: numeric_state
    entity_id: sensor.shower_heater_power
    above: 0.5
    below: 5
  condition:
  - condition: or
    conditions:
    - condition: state
      entity_id: sensor.shower_heater_status
      state: Idle
    - condition: state
      entity_id: sensor.shower_heater_status
      state: Power Off
    - condition: state
      entity_id: sensor.shower_heater_status
      state: Low Power
    - condition: state
      entity_id: sensor.shower_heater_status
      state: Max Power
  action:
  - service: input_select.select_option
    data:
      entity_id: input_select.shower_heater_status
      option: Light Only
- id: shower_heater_power_off
  alias: Set shower heater off state
  description: Mark shower heater as Power Off when switch is turned off.
  trigger:
  - platform: state
    entity_id: switch.shower_heater
    to: 'off'
  action:
  - service: input_select.select_option
    data:
      entity_id: input_select.shower_heater_status
      option: Power Off
- id: shower_heater_idle
  alias: Set shower heater idle state
  description: Mark shower heater as Idle when power is near zero but switch is on.
  trigger:
  - platform: numeric_state
    entity_id: sensor.shower_heater_power
    below: 0.1
    for:
      minutes: 1
  condition:
  - condition: state
    entity_id: switch.shower_heater
    state: 'on'
  action:
  - service: input_select.select_option
    data:
      entity_id: input_select.shower_heater_status
      option: Idle
- id: washingmachine_switchedoff
  alias: Washing Machine - Change State Switched Off
  description: Set washing machine status to Switched Off when Shelly outlet is off.
  trigger:
  - platform: state
    entity_id: switch.shellyplus1pm_b8d61a8a080c_washing_machine
    to: 'off'
  action:
  - service: input_select.select_option
    data:
      entity_id: input_select.washing_machine_status
      option: Switched Off
- id: washingmachine_powereddown
  alias: Washing Machine - Change State Powered Down
  description: 'When outlet is on but current is 0, mark washing machine as Powered
    Down.

    '
  trigger:
  - platform: state
    entity_id: switch.shellyplus1pm_b8d61a8a080c_washing_machine
    to: 'on'
  - platform: template
    value_template: "{{ (states('sensor.shellyplus1pm_b8d61a8a080c_washing_machine_current')\n
      \   | float(0) | round(0)) == 0 }}\n"
  action:
  - service: input_select.select_option
    data:
      entity_id: input_select.washing_machine_status
      option: Powered Down
- id: washingmachine_idle
  alias: Washing Machine - Change State Idle
  description: When a small amount of power is drawn, mark washing machine as Idle.
  trigger:
  - platform: numeric_state
    entity_id: sensor.shellyplus1pm_b8d61a8a080c_washing_machine_current
    above: 0
    below: 1.5
    for: 00:00:30
  condition:
  - condition: state
    entity_id: switch.shellyplus1pm_b8d61a8a080c_washing_machine
    state: 'on'
  - condition: or
    conditions:
    - condition: state
      entity_id: input_select.washing_machine_status
      state: Powered Down
    - condition: state
      entity_id: input_select.washing_machine_status
      state: Switched Off
    - condition: and
      conditions:
      - condition: state
        entity_id: binary_sensor.door_window_sensor_158d00044ab446
        state: 'on'
      - condition: state
        entity_id: input_select.washing_machine_status
        state: Clean
  action:
  - service: input_select.select_option
    data:
      entity_id: input_select.washing_machine_status
      option: Idle
- id: washingmachine_wash
  alias: Washing Machine - Change State Wash
  description: When current draw is high and door is closed, mark washing machine
    as Wash.
  trigger:
  - platform: numeric_state
    entity_id: sensor.shellyplus1pm_b8d61a8a080c_washing_machine_current
    above: 11
    for: 00:01:00
  condition:
  - condition: state
    entity_id: switch.shellyplus1pm_b8d61a8a080c_washing_machine
    state: 'on'
  - condition: state
    entity_id: binary_sensor.door_window_sensor_158d00044ab446
    state: 'off'
  - condition: or
    conditions:
    - condition: state
      entity_id: input_select.washing_machine_status
      state: Powered Down
    - condition: state
      entity_id: input_select.washing_machine_status
      state: Idle
    - condition: state
      entity_id: input_select.washing_machine_status
      state: Clean
  action:
  - service: input_select.select_option
    data:
      entity_id: input_select.washing_machine_status
      option: Wash
- id: washingmachine_clean
  alias: Washing Machine - Change State Clean
  description: 'When current drops and machine was in Wash, mark clothes as Clean.

    '
  trigger:
  - platform: numeric_state
    entity_id: sensor.shellyplus1pm_b8d61a8a080c_washing_machine_current
    below: 8
    for: 00:04:00
  condition:
  - condition: state
    entity_id: switch.shellyplus1pm_b8d61a8a080c_washing_machine
    state: 'on'
  - condition: state
    entity_id: binary_sensor.door_window_sensor_158d00044ab446
    state: 'off'
  - condition: state
    entity_id: input_select.washing_machine_status
    state: Wash
  action:
  - service: input_select.select_option
    data:
      entity_id: input_select.washing_machine_status
      option: Clean
- id: washingmachine_notify_clean
  alias: Washing Machine - Send alerts when clothes are clean
  description: Notify via Telegram when washing machine finished and someone is home.
  trigger:
  - platform: state
    entity_id: input_select.washing_machine_status
    to: Clean
    for:
      minutes: 1
  - platform: state
    entity_id: person.maxim
    to: home
    for:
      minutes: 2
  - platform: state
    entity_id: person.dana
    to: home
    for:
      minutes: 2
  - platform: time
    at: '10:00:00'
  condition:
    condition: and
    conditions:
    - condition: time
      after: '10:00:00'
      before: '23:00:00'
    - condition: state
      entity_id: group.household
      state: home
    - condition: state
      entity_id: input_select.washing_machine_status
      state: Clean
    - condition: state
      entity_id: input_boolean.disable_washing_machine_notification
      state: 'off'
    - condition: template
      value_template: "{% set last = states.automation.washing_machine_send_alerts_when_clothes_are_clean.attributes.last_triggered
        %} {% if last is not none %}\n  {{ (as_timestamp(now()) | int - as_timestamp(last)
        | int) > 1800 }}\n{% else %}\n  false\n{% endif %}\n"
  action:
  - service: notify.telegram_bot
    data:
      title: '*Clothes are clean!*'
      message: "{{ [\n  \"Time to hang them\",\n  \"Please empty the washing machine\"\n]
        | random }}\n"
