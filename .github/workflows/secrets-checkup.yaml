---
name: Secrets Checkup

on:
  push:
    paths:
      - "**.yaml"
      - "**.yml"
      - "**.json"
      - ".gitignore"
      - ".secrets.baseline"
      - "secrets.yaml.sample"
  pull_request:
    paths:
      - "**.yaml"
      - "**.yml"
      - "**.json"
      - ".gitignore"
      - ".secrets.baseline"
      - "secrets.yaml.sample"

jobs:
  secrets-checkup:
    name: Secrets Checkup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Verify secrets.yaml is not tracked
        run: |
          if git ls-files --error-unmatch secrets.yaml 2>/dev/null; then
            echo "::error::secrets.yaml is tracked by git! Remove it immediately with: git rm --cached secrets.yaml"
            exit 1
          fi
          if ! grep -qE '^secrets\.yaml$' .gitignore; then
            echo "::error::secrets.yaml is not listed in .gitignore"
            exit 1
          fi
          echo "secrets.yaml is properly gitignored"

      - name: Run detect-secrets scan
        run: |
          detect-secrets scan --baseline .secrets.baseline
          if detect-secrets audit --report .secrets.baseline 2>&1 | grep -q 'Real'; then
            echo "::error::detect-secrets found new secrets — run 'detect-secrets audit .secrets.baseline' locally to review"
            detect-secrets audit --report .secrets.baseline
            exit 1
          fi
          echo "No new secrets detected"

      - name: Cross-check !secret references against secrets.yaml.sample
        run: |
          ACTIVE_SECRETS=$(grep -roh '!secret [a-zA-Z_][a-zA-Z0-9_]*' \
            --include='*.yaml' --include='*.yml' \
            --exclude='secrets.yaml.sample' \
            --exclude-dir='.git' \
            --exclude-dir='.github' \
            --exclude-dir='blueprints' \
            | sed 's/!secret //' \
            | sort -u)

          SAMPLE_KEYS=$(grep -E '^[a-zA-Z_][a-zA-Z0-9_]*\s*:' secrets.yaml.sample \
            | sed 's/\s*:.*//' \
            | sort -u)

          MISSING=$(comm -23 <(echo "$ACTIVE_SECRETS") <(echo "$SAMPLE_KEYS"))

          if [ -n "$MISSING" ]; then
            echo "::error::Active !secret keys missing from secrets.yaml.sample:"
            echo "$MISSING"
            exit 1
          fi
          echo "All !secret references have entries in secrets.yaml.sample"

      - name: Check for sensitive files that should be gitignored
        run: |
          EXIT_CODE=0
          for pattern in "*.pem" "*.key" "*.crt" "*.p12" "*.pfx" ".env" ".env.*" \
            "SERVICE_ACCOUNT*.json" "GOOGLE_SERVICE_ACCOUNT*.json"; do
            FOUND=$(git ls-files "$pattern" 2>/dev/null)
            if [ -n "$FOUND" ]; then
              echo "::error::Sensitive file tracked by git: $FOUND"
              EXIT_CODE=1
            fi
          done
          if [ $EXIT_CODE -eq 0 ]; then
            echo "No sensitive files are tracked"
          fi
          exit $EXIT_CODE
